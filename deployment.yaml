
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agriculture
  labels:
    app: smart-agriculture
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: smart-agriculture
  template:
    metadata:
      labels:
        app: smart-agriculture
    spec:
      containers:
        - name: portal
          image: gopikaks/smart-agriculture-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agriculture-service
spec:
  type: NodePort
  selector:
    app: smart-agriculture
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
